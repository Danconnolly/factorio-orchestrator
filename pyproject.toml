[project]
name = "factorio-orchestrator"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    "factorio-benchmark==0.2.1",
    "inspect-ai==0.3.266",
    "mcp>=1.0,<2",
    "openai>=3,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_orchestrator"]

[tool.uv.sources]
factorio-benchmark = { path = "../factorio-benchmark" }
